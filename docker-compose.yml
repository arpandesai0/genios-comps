# `make start DIR=/path/to/data` runs this. DIR must contain companies.json and fx_rates.json.
services:
  api:
    build:
      context: .
      args:
        # The embedding model baked into the image (downloaded at build; the container runs offline).
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}  # empty = the model in src/comps/settings.toml
    environment:
      DATA_DIR: /data
      # Needed when EMBEDDING_MODEL names a model with no threshold in src/comps/settings.toml.
      NEAR_DUPLICATE_THRESHOLD: ${NEAR_DUPLICATE_THRESHOLD:-}
    volumes:
      - ${DIR:?Set DIR to a folder containing companies.json and fx_rates.json}:/data:ro
    ports:
      - "8000:8000"
    healthcheck:
      # Healthy only once the data is ingested and the API answers. If ingestion fails, the
      # container exits and the web UI is not started.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_USE_MOCKS: "0"
        API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
