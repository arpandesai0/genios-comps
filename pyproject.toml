[project]
name = "comps"
version = "0.1.0"
description = "Offline comparable-companies (comps table) service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "numpy==2.1.3",
    "scikit-learn==1.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.6",
    "mypy==2.4.1",
]
notebook = ["jupyterlab==4.3.4", "pandas==2.2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # Tuple concatenation (`a + ("x",)`) is deliberate and readable here; ruff's rewrite to unpacking
    # is an unsafe fix and purely stylistic, so it is not worth churning working code.
    "RUF005",
    # Comments intentionally use mathematical symbols such as `×` to document formulas.
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# scikit-learn and scipy ship no type information.
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true
