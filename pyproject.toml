[project]
name = "comps"
version = "0.1.0"
description = "Offline comparable-companies (comps table) service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
notebook = ["jupyterlab==4.3.4", "pandas==2.2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
