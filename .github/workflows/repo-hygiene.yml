name: repo-hygiene

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notebooks-cleared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail if any notebook has outputs or execution counts
        shell: python
        run: |
          import json, subprocess, sys
          files = subprocess.run(["git", "ls-files", "*.ipynb"], capture_output=True, text=True, check=True).stdout.split()
          bad = []
          for path in files:
              with open(path, encoding="utf-8") as fh:
                  nb = json.load(fh)
              for i, cell in enumerate(nb.get("cells", [])):
                  if cell.get("outputs") or cell.get("execution_count") is not None:
                      bad.append(f"{path}: cell {i}")
          if bad:
              print("Notebooks must be committed with outputs cleared:\n  " + "\n  ".join(bad))
              sys.exit(1)
          print(f"{len(files)} notebook(s) checked, all cleared.")

  forbidden-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if assignment data or local state is tracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files)
          # data/ anywhere, the glossary, the brief, local databases and env files
          forbidden=$(printf '%s\n' "$tracked" | grep -E '(^|/)data/|(^|/)GLOSSARY\.md$|(^|/)README\.brief\.md$|\.db$|(^|/)\.env$' || true)
          # the supplied dataset's file names are allowed only as synthetic fixtures under tests/
          dataset=$(printf '%s\n' "$tracked" | grep -E '(^|/)(companies|fx_rates)\.json$' | grep -vE '^tests/' || true)
          if [ -n "$forbidden$dataset" ]; then
            echo "These files must not be committed:"
            printf '%s\n' "$forbidden" "$dataset" | sed '/^$/d; s/^/  /'
            exit 1
          fi
          echo "No forbidden files tracked."
